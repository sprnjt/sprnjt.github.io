    Projects:
      - name: Fashion-Search
        summary: Built hybrid fashion retrieval using CLIP embeddings, K-means color extraction, and zero-shot scene classification with weighted re-ranking, enhanced with hierarchical indexing and inverted indices for 80% candidate filtering. Designed a semantic caching layer achieving 75-85% cache hit rates for sub-20ms response times. Fine-tuned CLIP ViT-L/14 with contrastive learning and hard negative mining, improving fashion-specific query precision by 15-20%.
        highlights:
          - Python
          - PyTorch
          - Hugging Face Transformers
          - ChromaDB
          - VLM
        url: https://github.com/sprnjt/fashion-multi

      - name: LegalAI
        summary: Developed a multi-agent legal document analysis system with 4 specialized AI agents (LegalAdvisor, ContractAnalyst, LegalStrategist, Team Lead) that process PDF contracts to deliver structured risk assessments, compliance checks, and actionable insights via a Streamlit UI. Integrated ChromaDB with Gemini embeddings for semantic search, configurable chunking, dual-party contract analysis, risk-based clause highlighting, and real-time chat.
        highlights:
          - Python
          - Agno AI
          - Streamlit
          - ChromaDB
        url: https://github.com/sprnjt/legal-ai-assistant

      - name: Polygon Colorizer
        summary: Built a diffusion-based conditioned U-Net (UNet2DConditionModel) to colorize grayscale polygon images using CLIP text embeddings from color descriptions, using PyTorch, Diffusers, and Weights & Biases for training, experiment tracking, and visualization.
        highlights:
          - PyTorch
          - Diffusers
          - Weights & Biases
        url: https://github.com/sprnjt/p-colorizer

      - name: SLM for English Stories
        summary: Built a 30M-parameter Small Language Model (SLM) for short English story generation, designing the pre-training pipeline from data preprocessing to autoregressive text generation, and evaluating a transformer-based text generation workflow.
        highlights:
          - PyTorch
          - Transformers
          - SLM Pre-training

